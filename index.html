<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1857c4">
<meta name="robots" content="noindex,nofollow">
<title>聯絡本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#eaeef5; --paper:#ffffff; --surface-2:#f4f7fc; --line:#dbe2f0;
    --ink:#1a1a1a; --ink-soft:#5a6172; --ink-faint:#8b93a5;
    --blue:#1857c4; --green:#2e9e4f; --pink:#e8267f; --orange:#f5871f;
    --blue-soft:#e7eefb; --green-soft:#e6f5ec; --pink-soft:#fde8f1;
    --shadow:0 1px 2px rgba(20,40,80,.06),0 6px 20px rgba(20,40,80,.08);
    --shadow-lift:0 10px 34px rgba(20,40,80,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10141b; --paper:#191e27; --surface-2:#212736; --line:#2e3646;
      --ink:#e9edf5; --ink-soft:#a7b1c4; --ink-faint:#7b8698;
      --blue:#6f9bf0; --green:#5fc47f; --pink:#f56aa6; --orange:#f8a648;
      --blue-soft:#1b2436; --green-soft:#16281d; --pink-soft:#2e1a25;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.4);
      --shadow-lift:0 10px 34px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10141b; --paper:#191e27; --surface-2:#212736; --line:#2e3646;
    --ink:#e9edf5; --ink-soft:#a7b1c4; --ink-faint:#7b8698;
    --blue:#6f9bf0; --green:#5fc47f; --pink:#f56aa6; --orange:#f8a648;
    --blue-soft:#1b2436; --green-soft:#16281d; --pink-soft:#2e1a25;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.4);
    --shadow-lift:0 10px 34px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  img{max-width:100%}
  [hidden]{display:none !important}
  .wrap{width:100%; max-width:520px; min-height:100vh;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    position:relative}

  /* ---------- 品牌列 ---------- */
  .brandbar{background:#fff; border:2.5px solid var(--blue); border-radius:18px;
    padding:12px 14px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow)}
  .brandbar img{width:132px; height:auto; flex:none; display:block}
  .brandbar .who{flex:1; min-width:0}
  .brandbar .cls{font-size:21px; font-weight:900; color:#1a1a1a; line-height:1.15; letter-spacing:.5px}
  .brandbar .sub{font-size:12px; color:#6a7285; font-weight:500; letter-spacing:1px}

  .toolrow{display:flex; justify-content:flex-end; gap:8px; margin:10px 2px 0}
  .iconbtn{background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
    width:38px; height:38px; border-radius:12px; font-size:16px; cursor:pointer;
    display:grid; place-items:center; box-shadow:var(--shadow); font-family:inherit}
  .iconbtn:active{transform:scale(.94)}

  .banner{background:var(--pink-soft); color:var(--pink); border:1px solid var(--line);
    border-radius:12px; padding:9px 13px; font-size:12.5px; margin-top:12px;
    display:none; text-align:center; font-weight:600}

  /* ---------- 班級切換（只有老師看得到） ---------- */
  .classnav{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; padding:11px 12px;
    background:var(--blue-soft); border:1.5px dashed var(--blue); border-radius:14px}
  .classnav .cn-lab{width:100%; font-size:11.5px; font-weight:800; color:var(--blue); letter-spacing:.5px}
  .chip{font-family:inherit; font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:999px;
    border:1.5px solid var(--blue); background:var(--paper); color:var(--blue); cursor:pointer}
  .chip.on{background:var(--blue); color:#fff}
  .chip:active{transform:scale(.96)}

  /* ---------- 列表 ---------- */
  .sechead{display:flex; align-items:baseline; justify-content:space-between; margin:22px 4px 12px}
  .sechead h2{font-size:15px; margin:0; font-weight:900; letter-spacing:1px; color:var(--ink-soft)}
  .sechead .hint{font-size:12px; color:var(--ink-faint)}

  .list{display:flex; flex-direction:column; gap:16px}
  .entry{background:var(--paper); border:2px solid var(--line); border-radius:18px;
    overflow:hidden; box-shadow:var(--shadow); position:relative}
  .entry.newest{border-color:var(--blue)}
  .ehead{display:flex; align-items:center; gap:9px; padding:11px 14px; border-bottom:1px solid var(--line)}
  .ehead .d{font-size:17px; font-weight:900; letter-spacing:.5px}
  .ehead .w{font-size:12.5px; color:var(--ink-faint); font-weight:600}
  .ehead .tagnew{margin-left:auto; background:var(--blue); color:#fff; font-size:11px; font-weight:800;
    padding:3px 10px; border-radius:999px; letter-spacing:.5px}
  .ehead .editbtn{margin-left:auto; background:var(--surface-2); border:1px solid var(--line);
    color:var(--ink-soft); border-radius:9px; padding:5px 10px; font-size:12.5px;
    font-family:inherit; font-weight:700; cursor:pointer}

  .shot{display:block; width:100%; background:var(--surface-2); cursor:zoom-in;
    aspect-ratio:297/210; object-fit:cover; object-position:top center}
  .shot.loading{display:grid; place-items:center; color:var(--ink-faint); font-size:13px;
    aspect-ratio:297/210; width:100%}
  .etext{padding:12px 15px 14px; font-size:14.5px; white-space:pre-wrap; word-break:break-word}
  .etext .tl{display:block; font-size:11.5px; font-weight:900; color:var(--green);
    letter-spacing:1px; margin-bottom:3px}
  .zoomhint{padding:0 15px 11px; font-size:11.5px; color:var(--ink-faint)}

  .empty{text-align:center; color:var(--ink-faint); font-size:14px; padding:44px 20px;
    background:var(--paper); border:2px dashed var(--line); border-radius:18px; line-height:1.9}
  .empty .big{font-size:30px; display:block; margin-bottom:6px}

  .morebtn{margin:16px auto 0; display:block; background:var(--paper); border:1.5px solid var(--line);
    color:var(--ink-soft); border-radius:999px; padding:10px 24px; font-size:14px;
    font-family:inherit; font-weight:700; cursor:pointer}

  /* ---------- 頁尾 ---------- */
  .foot{margin-top:26px; text-align:center}
  .slogan{font-size:15px; font-weight:900; color:var(--blue); line-height:1.7}
  .slogan .st{color:var(--orange)}
  .slogan .hi{color:var(--pink)}
  .lineid{margin-top:12px; font-size:12px; color:var(--ink-faint)}
  .lineid b{background:#06c755; color:#fff; border-radius:6px; padding:2px 7px;
    font-size:11px; letter-spacing:.5px; margin-right:6px}

  /* ---------- 密碼關卡 ---------- */
  .gate{position:fixed; inset:0; background:var(--bg); z-index:50; display:flex;
    align-items:center; justify-content:center; padding:24px}
  .gatebox{width:100%; max-width:360px; text-align:center}
  .gatebox .logo{background:#fff; border:2.5px solid var(--blue); border-radius:18px;
    padding:16px; margin-bottom:26px; box-shadow:var(--shadow)}
  .gatebox .logo img{width:190px; height:auto; display:block; margin:0 auto}
  .gatebox h1{font-size:19px; margin:0 0 6px; font-weight:900; letter-spacing:1px}
  .gatebox p{margin:0 0 20px; font-size:13px; color:var(--ink-soft)}
  .gatebox input{width:100%; font-family:inherit; font-size:26px; font-weight:800;
    text-align:center; letter-spacing:10px; color:var(--ink); background:var(--paper);
    border:2px solid var(--line); border-radius:14px; padding:14px; outline:none}
  .gatebox input:focus{border-color:var(--blue)}
  .gatebox .go{width:100%; margin-top:14px; background:var(--blue); color:#fff; border:none;
    border-radius:14px; padding:15px; font-size:17px; font-weight:800; font-family:inherit;
    letter-spacing:3px; cursor:pointer}
  .gatebox .go:active{transform:scale(.98)}
  .gatebox .err{min-height:22px; margin-top:12px; font-size:13px; font-weight:700; color:var(--pink)}

  /* ---------- 浮動鈕／表單 ---------- */
  .fab{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%;
    transform:translateX(-50%); background:var(--green); color:#fff; border:none; border-radius:999px;
    padding:15px 28px; font-size:16px; font-weight:800; font-family:inherit;
    box-shadow:var(--shadow-lift); cursor:pointer; z-index:20; letter-spacing:1px}
  .fab:active{transform:translateX(-50%) scale(.96)}

  .scrim{position:fixed; inset:0; background:rgba(10,20,40,.5); opacity:0; pointer-events:none;
    transition:opacity .22s ease; z-index:30}
  .scrim.open{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:100%;
    max-width:520px; background:var(--paper); border-radius:22px 22px 0 0;
    padding:8px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow:var(--shadow-lift);
    transition:transform .26s cubic-bezier(.22,.61,.36,1); z-index:31; max-height:93vh; overflow-y:auto}
  .sheet.open{transform:translate(-50%,0)}
  .grab{width:38px; height:4px; border-radius:99px; background:var(--line); margin:6px auto 14px}
  .sheet h2{font-size:18px; margin:0 0 16px; font-weight:900}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12.5px; font-weight:800; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.5px}
  .field input[type=date], .field select, .field textarea{width:100%; font-family:inherit; font-size:16px;
    color:var(--ink); background:var(--surface-2); border:1.5px solid var(--line);
    border-radius:12px; padding:12px 13px; outline:none}
  .field textarea{resize:vertical; min-height:80px; font-size:15px; line-height:1.7}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue)}
  .pickbtn{width:100%; background:var(--blue-soft); color:var(--blue); border:1.5px dashed var(--blue);
    border-radius:12px; padding:16px; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer}
  .thumb{margin-top:10px; position:relative}
  .thumb img{width:100%; border-radius:10px; border:1px solid var(--line); display:block}
  .thumb .rm{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.65); color:#fff;
    border:none; border-radius:8px; padding:6px 11px; font-size:12px; font-weight:700;
    font-family:inherit; cursor:pointer}
  .thumb .sz{font-size:11.5px; color:var(--ink-faint); margin-top:5px; text-align:center}
  .acts{display:flex; gap:10px; margin-top:4px}
  .btn{flex:1; font-family:inherit; font-size:16px; font-weight:800; padding:14px;
    border-radius:13px; border:none; cursor:pointer}
  .btn.save{background:var(--green); color:#fff; letter-spacing:2px}
  .btn.save:disabled{opacity:.5}
  .btn.del{background:transparent; color:var(--pink); border:1.5px solid var(--line); flex:none; width:56px; font-size:19px}

  /* ---------- 放大看 ---------- */
  .lb{position:fixed; inset:0; background:rgba(8,12,20,.94); z-index:60; display:none;
    overflow:auto; -webkit-overflow-scrolling:touch}
  .lb.open{display:block}
  .lb .inner{min-height:100%; display:flex; align-items:center; justify-content:center; padding:10px}
  .lb img{max-width:100%; height:auto; border-radius:6px; cursor:zoom-in}
  .lb.zoom .inner{display:block; padding:0}
  .lb.zoom img{max-width:none; width:230%; border-radius:0; cursor:zoom-out}
  .lb .close{position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px;
    background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:999px;
    width:40px; height:40px; font-size:19px; cursor:pointer; z-index:61; font-family:inherit}
  .lb .tip{position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); left:50%;
    transform:translateX(-50%); color:rgba(255,255,255,.72); font-size:12px;
    background:rgba(0,0,0,.45); padding:7px 15px; border-radius:999px; white-space:nowrap}

  .toast{position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%;
    transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg);
    padding:11px 20px; border-radius:999px; font-size:14px; font-weight:700; opacity:0;
    pointer-events:none; transition:all .25s; z-index:70; white-space:nowrap; max-width:90%}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>

<script>

     - 密碼公式：30 + 年級碼 + 班別碼（單班 0、兩班 1／2）

  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDv1zQAd2ElM_qlOspp3t3OnPF-p-b6CrI",
    authDomain: "sunny-contact-book.firebaseapp.com",
    projectId: "sunny-contact-book",

  };

  var COL      = "lianluoben";      // 每天一筆（小：日期／文字）
  var COL_IMG  = "lianluoben_img";  // 圖片另存（大：base64），需要時才載
  var ADMIN_PASS = "54300512";      // 老師管理密碼

  // 班級名冊：id＝網址代號（＝入班年份），y＝入班年份，v＝班別碼（0 單班／1、2 兩班）
  var CHANNELS = [
    {id:"2026",  y:2026, v:0},
    {id:"2025",  y:2025, v:0},
    {id:"2024a", y:2024, v:1},
    {id:"2024b", y:2024, v:2},
    {id:"2023",  y:2023, v:0}
  ];

  var SLOGANS = ["今天的努力，明天的實力！","每天進步一點點，就是超能力。","練習，讓困難變簡單。",
    "不怕慢，只怕站，持續就會到。","一步一腳印，天天在進步。","錯了沒關係，訂正就變厲害。",
    "不會，只是還沒學會。","難題，是讓你變強的機會。","勇敢挑戰，越難越有趣。","犯錯，是學習的開始。",
    "動動腦，數學好好玩。","想清楚，再下筆。","數學不是背，是懂道理。","一題一題慢慢想，答案自然來。",
    "專心五分鐘，勝過亂做半小時。","先訂正，再前進。","今天的功課，今天完成。","認真聽、仔細算、細心檢查。",
    "字寫工整，分數更漂亮。","好習慣，成就好成績。","你比昨天的自己更棒了！","堅持到底，就是贏家。",
    "慢慢來，比較快。","只要開始，永遠不嫌晚。","相信自己，你一定可以！"];

  var WK = ["日","一","二","三","四","五","六"];
  var CN = {3:"三",4:"四",5:"五",6:"六"};
  var PAGE = 6;   // 一次顯示幾筆

  var state = {ch:null, rows:[], db:null, admin:false, unsub:null,
               shown:PAGE, editKey:null, editImg:null, imgCache:{}, io:null};

  /* ---------- 小工具 ---------- */
  function $(id){return document.getElementById(id);}
  function qs(k){
    var m=new RegExp("[?&]"+k+"=([^&]*)").exec(window.location.search);
    return m?decodeURIComponent(m[1]):null;
  }
  function pad(n){return (n<10?"0":"")+n;}
  function todayId(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function mdText(s){var p=s.split("-");return (+p[1])+"/"+(+p[2]);}
  function wkText(s){return "週"+WK[parseD(s).getDay()];}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");
    clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},2200);}
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

  /* ---------- 學年／年級／密碼：全部用算的 ---------- */
  // 學年以 8/1 換代；?sy=2027 可強制模擬（測試用）
  function schoolYear(){
    var f=qs("sy");
    if(f && /^\d{4}$/.test(f)) return +f;
    var d=new Date();
    return (d.getMonth()+1)>=8 ? d.getFullYear() : d.getFullYear()-1;
  }
  function gradeOf(ch){ return 3 + (schoolYear() - ch.y); }
  function isGrad(ch){ return gradeOf(ch) > 6; }
  function titleOf(ch){
    var g=gradeOf(ch);
    if(g>6) return "已畢業";
    if(g<3) return "尚未開班";
    return CN[g]+"年級"+(ch.v===1?"A":ch.v===2?"B":"");
  }
  function passOf(ch){ var g=gradeOf(ch); return "30"+g+ch.v; }
  function findCh(id){
    for(var i=0;i<CHANNELS.length;i++) if(CHANNELS[i].id===id) return CHANNELS[i];
    return null;
  }

  /* ---------- 密碼關卡 ---------- */
  function unlockKey(ch){ return "lb_ok_"+ch.id; }
  function isUnlocked(ch){
    if(state.admin) return true;
    return lsGet(unlockKey(ch)) === passOf(ch);   // 8/1 密碼換代後自動失效
  }
  function doUnlock(ch){ lsSet(unlockKey(ch), passOf(ch)); }

  function showGate(){ $("gate").hidden=false; $("app").hidden=true; $("fab").hidden=true;
    setTimeout(function(){ try{$("gatePass").focus();}catch(e){} },250); }
  function hideGate(){ $("gate").hidden=true; $("app").hidden=false; }

  function tryGate(){
    var v=$("gatePass").value.trim();
    if(!v){ return; }
    // 管理密碼也能從這裡進（老師方便）
    if(v===ADMIN_PASS){ state.admin=true; lsSet("lb_admin",ADMIN_PASS); afterUnlock(); return; }
    if(state.ch && v===passOf(state.ch)){ doUnlock(state.ch); afterUnlock(); return; }
    $("gateErr").textContent="密碼不對，請跟老師確認";
    $("gatePass").value="";
    try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){}
  }
  function afterUnlock(){
    $("gateErr").textContent=""; $("gatePass").value="";
    hideGate(); applyAdminUI(); subscribe();
  }

  /* ---------- 老師模式 ---------- */
  function applyAdminUI(){
    $("fab").hidden = !state.admin;
    $("classnav").hidden = !state.admin;
    $("admOut").hidden = !state.admin;
    if(state.admin) buildClassNav();
    render();
  }
  function buildClassNav(){
    var nav=$("classnav");
    nav.innerHTML='<span class="cn-lab">老師專用 · 切換班級</span>';
    CHANNELS.forEach(function(c){
      var b=document.createElement("button");
      b.className="chip"+(state.ch&&c.id===state.ch.id?" on":"");
      b.textContent=titleOf(c);
      b.onclick=function(){ switchTo(c); };
      nav.appendChild(b);
    });
  }
  function switchTo(c){
    state.ch=c; state.shown=PAGE; state.imgCache={};
    try{ history.replaceState(null,"","?c="+c.id); }catch(e){}
    $("clsName").textContent=titleOf(c);
    buildClassNav(); subscribe();
  }

  /* ---------- 讀資料 ---------- */
  function cacheKey(){ return "lb_meta_"+state.ch.id; }
  function subscribe(){
    if(!state.ch) return;
    var c=lsGet(cacheKey());
    if(c){ try{ state.rows=JSON.parse(c)||[]; render(); }catch(e){} }
    if(!state.db) return;
    if(state.unsub){ try{state.unsub();}catch(e){} state.unsub=null; }
    var chid=state.ch.id;
    state.unsub = state.db.collection(COL).where("ch","==",chid).onSnapshot(function(snap){
      var rows=[];
      snap.forEach(function(d){
        var v=d.data()||{};
        rows.push({id:d.id, date:v.date||"", text:v.text||"", hasImg:!!v.hasImg});
      });
      rows.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
      if(state.ch.id!==chid) return;          // 已切換班級，丟棄舊回應
      state.rows=rows;
      lsSet(cacheKey(), JSON.stringify(rows));
      banner(""); render();
    }, function(){ banner("雲端連線不順，顯示的是上次看過的內容"); });
  }
  function banner(msg){
    var b=$("banner");
    if(msg){ b.textContent=msg; b.style.display="block"; } else { b.style.display="none"; }
  }

  /* ---------- 畫面 ---------- */
  function render(){
    if(!state.ch) return;
    $("clsName").textContent = titleOf(state.ch);

    var host=$("list"), rows=state.rows;
    $("cnt").textContent = rows.length ? ("共 "+rows.length+" 篇") : "";

    if(!rows.length){
      host.innerHTML='<div class="empty"><span class="big">☀</span>'+
        (state.admin ? "這個班還沒有紀錄<br>按下面的綠色按鈕上傳第一篇"
                     : "老師還沒上傳聯絡本<br>晚點再來看看")+'</div>';
      $("moreBtn").hidden=true; return;
    }

    var n=Math.min(state.shown, rows.length), html="";
    for(var i=0;i<n;i++){
      var r=rows[i], newest=(i===0);
      html+='<article class="entry'+(newest?" newest":"")+'" data-id="'+esc(r.id)+'">'+
        '<div class="ehead">'+
          '<span class="d">'+mdText(r.date)+'</span>'+
          '<span class="w">'+wkText(r.date)+'</span>'+
          (state.admin
            ? '<button class="editbtn" data-edit="'+esc(r.id)+'">修改</button>'
            : (newest?'<span class="tagnew">最新</span>':''))+
        '</div>';
      if(r.hasImg){
        html+='<div class="shot loading" data-img="'+esc(r.id)+'">載入中…</div>';
      }
      if(r.text){
        html+='<div class="etext"><span class="tl">老師補充</span>'+esc(r.text)+'</div>';
      }
      if(r.hasImg){ html+='<div class="zoomhint">點圖片可放大看</div>'; }
      html+='</article>';
    }
    host.innerHTML=html;
    $("moreBtn").hidden = rows.length<=n;
    hookImages();
  }

  // 圖片載入：最新兩篇直接抓（不能賭延後載入——LINE 內建瀏覽器或分頁在背景時，
  // IntersectionObserver 的回呼不會觸發，家長就會一直看到「載入中」）；其餘捲到才抓，省流量。
  var EAGER=2;
  function hookImages(){
    var slots=document.querySelectorAll(".shot.loading"), i;
    if(!slots.length) return;
    if(state.io){ state.io.disconnect(); state.io=null; }

    var eager=Math.min(EAGER, slots.length);
    for(i=0;i<eager;i++) loadImg(slots[i]);

    var rest=[];
    for(i=eager;i<slots.length;i++) rest.push(slots[i]);
    if(!rest.length) return;

    if(!("IntersectionObserver" in window)){
      for(i=0;i<rest.length;i++) loadImg(rest[i]);
      return;
    }
    state.io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){ state.io.unobserve(e.target); loadImg(e.target); }
      });
    },{rootMargin:"400px 0px"});
    for(i=0;i<rest.length;i++) state.io.observe(rest[i]);

    // 保險：分頁從背景切回前景時，把還沒載到的補抓一次
    if(!state.visHook){
      state.visHook=true;
      document.addEventListener("visibilitychange",function(){
        if(document.visibilityState==="visible"){
          var left=document.querySelectorAll(".shot.loading");
          for(var k=0;k<Math.min(EAGER,left.length);k++) loadImg(left[k]);
        }
      });
    }
  }
  function loadImg(slot){
    var id=slot.getAttribute("data-img");
    if(state.imgCache[id]){ paintImg(slot,state.imgCache[id]); return; }
    if(!state.db){ slot.textContent="離線中，無法載入圖片"; return; }
    state.db.collection(COL_IMG).doc(id).get().then(function(d){
      var v=d.exists?(d.data()||{}):{};
      if(v.img){ state.imgCache[id]=v.img; paintImg(slot,v.img); }
      else slot.textContent="圖片不見了";
    }).catch(function(){ slot.textContent="圖片載入失敗，請重新整理"; });
  }
  function paintImg(slot,data){
    var img=document.createElement("img");
    img.className="shot"; img.src=data; img.alt="聯絡本";
    img.addEventListener("click",function(){ openLb(data); });
    if(slot.parentNode) slot.parentNode.replaceChild(img,slot);
  }

  /* ---------- 放大看 ---------- */
  var LB_TIP = "點圖片可放大 · 手機橫著拿更清楚";
  function openLb(src){
    $("lbImg").src=src; $("lb").classList.add("open"); $("lb").classList.remove("zoom");
    $("lbTip").textContent = LB_TIP;
    document.body.style.overflow="hidden";
  }
  function closeLb(){
    $("lb").classList.remove("open"); $("lb").classList.remove("zoom");
    $("lbImg").src=""; document.body.style.overflow="";
  }
  $("lbClose").addEventListener("click",closeLb);
  $("lbImg").addEventListener("click",function(e){
    e.stopPropagation();
    var lb=$("lb"), z=lb.classList.toggle("zoom");
    $("lbTip").textContent = z ? "再點一下縮小 · 可左右拖動" : LB_TIP;
    if(z) lb.scrollLeft=(lb.scrollWidth-lb.clientWidth)/2;
  });
  $("lb").addEventListener("click",function(e){ if(e.target===$("lb")||e.target.className==="inner") closeLb(); });

  /* ---------- 壓縮圖片（控制在 Firestore 單筆 1MB 內） ---------- */
  var MAX_BYTES = 900000;
  function compress(file, cb){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.naturalWidth, h=img.naturalHeight;
      if(!w||!h){ cb(null); return; }
      function enc(scale,q){
        var cw=Math.max(1,Math.round(w*scale)), chh=Math.max(1,Math.round(h*scale));
        var cv=document.createElement("canvas"); cv.width=cw; cv.height=chh;
        var cx=cv.getContext("2d");
        cx.fillStyle="#ffffff"; cx.fillRect(0,0,cw,chh);
        cx.drawImage(img,0,0,cw,chh);
        return cv.toDataURL("image/jpeg",q);
      }
      var scale=Math.min(1, 1600/Math.max(w,h)), q=0.82;
      var out=enc(scale,q), guard=0;
      while(out.length>MAX_BYTES && guard<10){
        guard++;
        if(q>0.5) q-=0.08; else scale*=0.85;
        out=enc(scale,q);
      }
      cb(out.length>MAX_BYTES ? null : out);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
    img.src=url;
  }

  /* ---------- 編輯表單 ---------- */
  var sheet=$("sheet"), admSheet=$("admSheet"), scrim=$("scrim");
  function closeAll(){ scrim.classList.remove("open"); sheet.classList.remove("open"); admSheet.classList.remove("open"); }
  function openSheet(id){
    state.editKey=id||null; state.editImg=null;
    var ex=null;
    if(id){ for(var i=0;i<state.rows.length;i++) if(state.rows[i].id===id){ ex=state.rows[i]; break; } }

    var sel=$("fCls"); sel.innerHTML="";
    CHANNELS.forEach(function(c){
      if(isGrad(c) && (!ex)) return;                 // 已畢業的班不出現在新增選單
      var o=document.createElement("option");
      o.value=c.id; o.textContent=titleOf(c);
      sel.appendChild(o);
    });
    sel.value = ex ? ex.id.split("_")[0] : state.ch.id;

    $("fDate").value = ex ? ex.date : todayId();
    $("fText").value = ex ? (ex.text||"") : "";
    $("sheetTitle").textContent = ex ? "修改聯絡本" : "上傳聯絡本";
    $("delBtn").hidden = !ex;
    $("thumb").hidden=true; $("thumbImg").src=""; $("fFile").value="";
    $("pickBtn").textContent = "📷　從相簿選一張";

    if(ex && ex.hasImg){
      $("pickBtn").textContent="📷　換一張照片";
      if(state.imgCache[ex.id]){
        state.editImg="KEEP";
        $("thumbImg").src=state.imgCache[ex.id]; $("thumb").hidden=false;
        $("thumbSz").textContent="目前的照片（不換就保持原樣）";
      }else{
        state.editImg="KEEP";
        $("thumbSz").textContent="";
      }
    }
    scrim.classList.add("open"); sheet.classList.add("open");
  }

  $("pickBtn").addEventListener("click",function(){ $("fFile").click(); });
  $("fFile").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0];
    if(!f) return;
    $("pickBtn").textContent="處理中…";
    compress(f,function(data){
      if(!data){ $("pickBtn").textContent="📷　從相簿選一張"; toast("這張圖太大了，請用截圖或縮小再試"); return; }
      state.editImg=data;
      $("thumbImg").src=data; $("thumb").hidden=false;
      $("thumbSz").textContent="已壓縮：約 "+Math.round(data.length/1024)+" KB";
      $("pickBtn").textContent="📷　換一張照片";
    });
  });
  $("rmImg").addEventListener("click",function(){
    state.editImg=null; $("thumb").hidden=true; $("thumbImg").src=""; $("fFile").value="";
    $("pickBtn").textContent="📷　從相簿選一張";
  });

  $("saveBtn").addEventListener("click",function(){
    var chid=$("fCls").value, date=$("fDate").value, text=$("fText").value.trim();
    if(!date){ toast("請先選日期"); return; }
    var hasNewImg = state.editImg && state.editImg!=="KEEP";
    var keepImg   = state.editImg==="KEEP";
    if(!hasNewImg && !keepImg && !text){ toast("請上傳照片或打幾個字"); return; }
    if(!state.db){ toast("目前離線，等有網路再儲存"); return; }

    var key=chid+"_"+date, oldKey=state.editKey;
    var btn=$("saveBtn"); btn.disabled=true; btn.textContent="儲存中…";

    var meta={ch:chid, date:date, text:text||"", hasImg:(hasNewImg||keepImg), updatedAt:new Date().toISOString()};
    var batch=state.db.batch();
    batch.set(state.db.collection(COL).doc(key), meta);
    if(hasNewImg) batch.set(state.db.collection(COL_IMG).doc(key), {img:state.editImg});
    if(oldKey && oldKey!==key){
      batch.delete(state.db.collection(COL).doc(oldKey));
      batch.delete(state.db.collection(COL_IMG).doc(oldKey));
    }
    batch.commit().then(function(){
      if(hasNewImg) state.imgCache[key]=state.editImg;
      if(oldKey && oldKey!==key) delete state.imgCache[oldKey];
      btn.disabled=false; btn.textContent="儲存";
      closeAll();
      if(chid!==state.ch.id){ toast("已存到「"+titleOf(findCh(chid))+"」"); }
      else toast("已儲存 ✓ 家長現在看得到了");
    }).catch(function(){
      btn.disabled=false; btn.textContent="儲存";
      toast("儲存失敗，請檢查網路再試一次");
    });
  });

  $("delBtn").addEventListener("click",function(){
    var id=state.editKey; if(!id||!state.db) return;
    var r=null; for(var i=0;i<state.rows.length;i++) if(state.rows[i].id===id) r=state.rows[i];
    if(!confirm((r?mdText(r.date):"")+" 這篇聯絡本要刪掉嗎？")) return;
    var batch=state.db.batch();
    batch.delete(state.db.collection(COL).doc(id));
    batch.delete(state.db.collection(COL_IMG).doc(id));
    batch.commit().then(function(){ delete state.imgCache[id]; closeAll(); toast("已刪除"); })
      .catch(function(){ toast("刪除失敗，請再試一次"); });
  });

  /* ---------- 事件 ---------- */
  $("fab").addEventListener("click",function(){ openSheet(null); });
  $("list").addEventListener("click",function(e){
    var b=e.target.closest ? e.target.closest("[data-edit]") : null;
    if(b) openSheet(b.getAttribute("data-edit"));
  });
  $("moreBtn").addEventListener("click",function(){ state.shown+=PAGE; render(); });
  scrim.addEventListener("click",closeAll);

  $("gateGo").addEventListener("click",tryGate);
  $("gatePass").addEventListener("keydown",function(e){ if(e.key==="Enter") tryGate(); });
  $("gatePass").addEventListener("input",function(){ $("gateErr").textContent=""; });

  $("gearBtn").addEventListener("click",function(){
    $("admPass").value=""; scrim.classList.add("open"); admSheet.classList.add("open");
  });
  $("admGo").addEventListener("click",function(){
    if($("admPass").value.trim()===ADMIN_PASS){
      state.admin=true; lsSet("lb_admin",ADMIN_PASS);
      closeAll(); applyAdminUI(); toast("老師模式已開啟");
    }else toast("管理密碼不對");
  });
  $("admOut").addEventListener("click",function(){
    state.admin=false; lsDel("lb_admin"); closeAll(); applyAdminUI(); toast("已登出老師模式");
    if(state.ch && !isUnlocked(state.ch)) showGate();
  });

  /* ---------- 深淺色 ---------- */
  (function(){
    var root=document.documentElement, saved=lsGet("lb_theme");
    if(saved) root.setAttribute("data-theme",saved);
    $("themeBtn").addEventListener("click",function(){
      var cur=root.getAttribute("data-theme");
      var isDark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var next=isDark?"light":"dark";
      root.setAttribute("data-theme",next); lsSet("lb_theme",next);
    });
  })();

  /* ---------- 標語（每天換一句） ---------- */
  (function(){
    var d=new Date(), n=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
    var s=SLOGANS[n%SLOGANS.length];
    var parts=s.split("，");
    $("slogan").innerHTML='<span class="st">★</span> '+
      (parts.length>1 ? esc(parts[0])+'，<span class="hi">'+esc(parts.slice(1).join("，"))+'</span>'
                      : esc(s))+' <span class="st">★</span>';
  })();

  /* ---------- 啟動 ---------- */
  state.admin = (lsGet("lb_admin")===ADMIN_PASS);

  var want=qs("c");
  var ch=want?findCh(want):null;
  if(!ch && state.admin) ch=CHANNELS[0];        // 老師直接開根網址 → 給第一班
  state.ch=ch;

  if(!ch){
    // 沒有班級代號：不透露任何班級資訊，只顯示密碼畫面（輸入管理密碼可進）
    $("gate").hidden=false;
    $("gateErr").textContent="";
  }else if(isGrad(ch) && !state.admin){
    $("gate").hidden=true;
    $("app").hidden=false;
    $("clsName").textContent="已畢業";
    $("list").innerHTML='<div class="empty"><span class="big">🎓</span>'+
      '這個班已經畢業囉<br>謝謝你們這幾年的努力 ☀</div>';
    $("cnt").textContent="";
  }else if(isUnlocked(ch)){
    hideGate(); applyAdminUI();
  }else{
    showGate();
  }

  /* ---------- 連 Firebase ---------- */
  try{
    if(typeof firebase==="undefined") throw new Error("no sdk");
    firebase.initializeApp(FIREBASE_CONFIG);
    state.db=firebase.firestore();
    try{ state.db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
    if(state.ch && !$("app").hidden) subscribe();
  }catch(e){
    state.db=null;
    banner("目前離線，顯示上次看過的內容");
  }
})();
</script>
</body>
</html>
