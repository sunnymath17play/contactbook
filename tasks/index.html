<style>
/* 2026-11-02 SUNNY：各班完成訂正紀錄；三年級、四年級、五年級B 打勾順便寵物蛋加點
   2026-11-24 改版：班級 → 講義／單元複習／期末評量／考古卷 → 一張一張；平板上課離線也能勾，回家連網自動上傳 */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: 'PingFang TC', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 12px 14px 90px; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
header img { width: 34px; height: 34px; object-fit: contain; opacity: .9; }
header h1 { font-size: 20px; margin: 0; color: var(--main); letter-spacing: 1px; }
header .sub { font-size: 12px; opacity: .6; margin-left: auto; }
header .home { border: 2px solid var(--main); background: #fff; color: var(--main); border-radius: 18px; padding: 5px 12px; font-size: 14px; font-weight: 700; }
.howto { display: flex; align-items: center; gap: 12px; font-size: 17px; margin: 10px 0; }
.howto b.n { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--main); color: #fff; display: flex; align-items: center; justify-content: center; }
.howto svg { vertical-align: middle; }

.net { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 8px 12px; margin: 0 0 10px; font-size: 15px; font-weight: 600; }
.net.off { background: #EEF1F5; color: #4A5568; border: 2px solid #CBD5E0; }
.net.wait { background: #FFF8E1; color: #7A5A00; border: 2px solid #FFD666; }
.net .btn { margin-left: auto; }

.tabs, .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 2px solid var(--line); background: #fff; color: var(--text); border-radius: 22px;
  padding: 8px 16px; font-size: 16px; font-weight: 700; }
.tab.on { background: var(--main); border-color: var(--main); color: #fff; }
.tab.peek { margin-left: auto; border-color: #E2E8F0; color: #A0AEC0; font-size: 13px; padding: 8px 12px; background: #fff8; }
.tab.peek.on { background: #FFF4E5; border-color: #FFB547; color: #C2410C; }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #fff9; border-radius: 16px; padding: 5px; margin: 4px 0 10px; }
.cat { border: 0; background: transparent; color: var(--text); border-radius: 12px; padding: 10px 4px; font-size: 17px; font-weight: 700; }
.cat.on { background: #fff; color: var(--main); box-shadow: 0 2px 8px #0002, 0 0 0 2px var(--main) inset; }
.chips { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 2px solid var(--line); background: #fffc; color: var(--text); border-radius: 14px;
  padding: 7px 14px; font-size: 15px; font-weight: 600; text-align: left; line-height: 1.3; }
.chip small { display: block; font-size: 11px; font-weight: 500; opacity: .65; }
.chip.on { border-color: var(--main); background: #fff; box-shadow: 0 0 0 2px var(--main) inset; }
.chip.done small { color: #22A06B; opacity: 1; font-weight: 700; }
.chip.add { border-style: dashed; color: var(--main); background: #fff6; }
.chip.tool { border-style: dashed; background: #fff6; opacity: .8; }
.chip.fold { background: transparent; border-color: transparent; opacity: .7; padding-left: 4px; }
.chip.old { opacity: .6; background: #F3F4F6; }
.chip.old.on { opacity: 1; }
.mrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #EEF2F6; font-size: 16px; }
.mrow span { flex: 1; font-weight: 600; }
.mrow.old span { opacity: .45; }

.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0 10px; }
.bar h2 { font-size: 20px; margin: 0; }
.bar .cnt { font-size: 15px; font-weight: 700; color: var(--main); }
.btn { border: 2px solid var(--line); background: #fff; color: var(--text); border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.btn.main { background: var(--main); border-color: var(--main); color: #fff; }
.btn.danger { color: #E5484D; border-color: #F5C2C4; }
.pet { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600;
  background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 4px 12px; }
.pet input { width: 20px; height: 20px; accent-color: var(--main); }

.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kid { position: relative; display: flex; align-items: center; gap: 10px; border: 2px solid #E2E8F0; background: #fff; color: var(--text);

.kid .no { font-size: 12px; opacity: .4; width: 18px; text-align: right; flex: none; }
.kid .box { margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 10px; border: 2px solid #CBD5E0; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.kid.ok { background: #EAFBF1; border-color: #9BE3BC; }
.kid.ok .box { border: 0; }
.kid.last { border-color: #FFB547; background: #FFF4E5; }
.kid .tag { position: absolute; top: -9px; left: 10px; font-size: 11px; background: #FFB547; color: #fff; border-radius: 8px; padding: 1px 7px; }
.kid .tag.late { background: #F5A524; }
.kid .tag.drag { background: #E5484D; }
.kid.drag { border-color: #F5A3A5; background: #FFF1F1; }
.presets button.on { background: var(--main); border-color: var(--main); color: #fff; }
.preview { margin-top: 10px; font-size: 14px; background: #F5F8FB; border-radius: 10px; padding: 8px 10px; }
.kid .up { position: absolute; top: 4px; right: 6px; font-size: 11px; opacity: .55; }

.left { margin-top: 14px; background: #fffc; border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.left .all { color: #22A06B; font-weight: 700; }
.left .lastline { color: #C2410C; font-weight: 700; }

.watch { background: #FFF4E5; border: 2px solid #FFB547; border-radius: 14px; padding: 10px 12px; margin: 0 0 12px; }
.watch h3 { margin: 0 0 6px; font-size: 15px; color: #C2410C; }
.watch button { display: block; width: 100%; text-align: left; border: 0; background: #fff; border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 15px; color: #5A3B00; }
.watch button small { opacity: .6; font-size: 12px; }
.watch .hint { font-size: 12px; opacity: .7; margin-top: 6px; }
.empty { text-align: center; padding: 50px 10px; opacity: .7; font-size: 16px; line-height: 1.8; }

.mask { position: fixed; inset: 0; background: #0006; display: flex; align-items: flex-end; justify-content: center; z-index: 9; }
.sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 88vh; overflow: auto; }
@media (min-width: 700px) { .mask { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h3 { margin: 0 0 12px; color: var(--main); }
.sheet label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; opacity: .75; }
.sheet input[type=text] { width: 100%; font-size: 17px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; outline: none; }
.sheet input:focus { border-color: var(--main); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.presets button { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 10px; font-size: 14px; color: var(--text); }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.row .grow { flex: 1; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2D3748; color: #fff;
  padding: 10px 18px; border-radius: 22px; font-size: 15px; z-index: 20; box-shadow: 0 4px 14px #0003; max-width: 90vw; text-align: center; }
.login { max-width: 360px; margin: 80px auto; background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 4px 20px #0001; text-align: center; }
.login img { width: 80px; }
.login input { width: 100%; font-size: 20px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; text-align: center; margin: 14px 0; }

/* 2026-11-26 課堂狀況：手機（375px）優先，平板再放大 */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 2px 0 10px; }
.mode { border: 2px solid var(--line); background: #fff8; color: var(--text); border-radius: 14px; padding: 11px 6px; font-size: 17px; font-weight: 700; opacity: .8; }
.mode.on { background: #fff; color: var(--main); border-color: var(--main); opacity: 1; box-shadow: 0 2px 10px #0001; }
.stbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; margin: 0 -14px 10px; padding: 8px 14px;
  background: #ffffffe8; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom: 1px solid #0000000d; }
.stbar .nav { width: 44px; height: 44px; flex: none; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-size: 22px; color: var(--main); font-weight: 700; padding: 0; }
.stbar .nav:disabled { opacity: .3; }
.stbar .day { flex: 1; text-align: center; font-size: 18px; font-weight: 800; line-height: 1.15; }
.stbar .day small { display: block; font-size: 12px; font-weight: 600; opacity: .6; }
.stbar .day button { border: 0; background: var(--main); color: #fff; border-radius: 10px; font-size: 12px; padding: 2px 8px; margin-top: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: #0000000a; border-radius: 12px; padding: 3px; margin: 0 0 10px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 9px 4px; font-size: 16px; font-weight: 700; color: var(--text); opacity: .7; }
.seg button.on { background: #fff; color: var(--main); opacity: 1; box-shadow: 0 1px 4px #0002; }
.kids.st { grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (min-width: 600px) { .kids.st { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; } }
.stk { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; border: 2px solid #E2E8F0; background: #fff;
  color: var(--text); border-radius: 16px; padding: 10px 10px 9px; min-height: 66px; font-size: 18px; font-weight: 700; text-align: left; user-select: none; word-break: break-all; }
.stk .no { position: absolute; top: 5px; right: 8px; font-size: 11px; opacity: .35; }
.stk.has { border-color: #CBD5E0; background: #F8FAFC; }
.stk .up { position: absolute; bottom: 4px; right: 6px; font-size: 10px; opacity: .55; }
.dots { display: flex; gap: 4px; align-items: center; min-height: 10px; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.dots small { font-size: 11px; opacity: .6; font-weight: 700; }
.sthint { font-size: 13px; opacity: .6; text-align: center; margin: 12px 0 0; }
.sthead { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
.sthead b { font-size: 28px; color: var(--main); }
.sthead span { font-size: 15px; opacity: .65; font-weight: 600; }
.stgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stb { display: flex; align-items: center; gap: 8px; border: 2px solid #E2E8F0; background: #fff; color: var(--text); border-radius: 14px;
  min-height: 58px; padding: 8px 10px; font-size: 17px; font-weight: 700; text-align: left; }
.stb i { font-style: normal; font-size: 22px; flex: none; }
.stb .ck { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #CBD5E0; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; color: transparent; }
.stb.on { background: var(--c); border-color: var(--c); color: #fff; }
.stb.on .ck { border-color: #fff; background: #fff; color: var(--c); }
.sheet .memo { width: 100%; font-size: 17px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; outline: none; margin-top: 12px; }
.sheet .memo:focus { border-color: var(--main); }
.strecent { font-size: 13px; opacity: .7; margin-top: 10px; }
.btn.big { flex: 1; padding: 13px; font-size: 18px; border-radius: 14px; }
.lcard > button { display: block; width: 100%; border: 0; background: transparent; padding: 0; color: inherit; text-align: left; font: inherit; }
.tl button { flex: none; border: 0; background: transparent; font-size: 13px; color: var(--main); font-weight: 700; padding: 2px 4px; }
.lmore { text-align: center; font-size: 14px; opacity: .65; margin: 12px 0; }
.lcard { display: block; width: 100%; text-align: left; border: 2px solid #E2E8F0; background: #fff; color: var(--text); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; font-size: 17px; }
.lcard.warn { border-color: #FFB547; background: #FFF8EE; }
.lcard .top { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.lcard .top .n { margin-left: auto; font-size: 14px; font-weight: 700; opacity: .7; }
.lcard .tg { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.lcard .tg span { font-size: 13px; font-weight: 700; background: #F1F5F9; border-radius: 8px; padding: 2px 8px; }
.tl { margin-top: 10px; border-top: 1px dashed #E2E8F0; padding-top: 4px; }
.tl div { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; font-size: 15px; border-bottom: 1px solid #F1F5F9; }
.tl div:last-child { border-bottom: 0; }
.tl b { flex: none; width: 74px; font-size: 14px; opacity: .75; }
.tl span { flex: 1; line-height: 1.45; }
.tl em { font-style: normal; display: block; font-size: 13px; opacity: .7; }
@media (max-width: 480px) {

  header .sub { display: none; }
  header .home { margin-left: auto; white-space: nowrap; font-size: 13px; padding: 5px 10px; }
  .mode { padding: 9px 4px; font-size: 16px; }
  .seg button { padding: 7px 4px; font-size: 15px; }
}
/* 大字版（2026-11-26 SUNNY 老花：課堂狀況不要圖示、字放大） */
.stb { justify-content: space-between; gap: 6px; min-height: 68px; padding: 10px 12px; font-size: 24px; white-space: nowrap; }
.stb .ck { margin-left: 0; width: 28px; height: 28px; font-size: 16px; }
.sthead b { font-size: 32px; }
.sthead span { font-size: 18px; }
.sheet .memo { font-size: 20px; padding: 13px; }
.strecent { font-size: 16px; line-height: 1.5; }
.btn.big { font-size: 22px; padding: 14px; }
.sheet .btn.danger { font-size: 18px; padding: 12px 16px; border-radius: 14px; }
.stk { font-size: 22px; min-height: 74px; }
.stk .no { font-size: 12px; }
.stk .up { font-size: 11px; }
.dot { width: 13px; height: 13px; }
.dots small { font-size: 13px; }

.stbar .day small { font-size: 15px; }
.stbar .day button { font-size: 15px; padding: 3px 10px; }
.stbar .nav { width: 50px; height: 50px; font-size: 26px; }

.sthint { font-size: 16px; }

.lcard .top { font-size: 22px; }
.lcard .top .n { font-size: 17px; }

.tl div { font-size: 18px; }

/* 可累加的按鈕：點一下＋1，「−1」扣回 */
.stb.multi { cursor: pointer; flex-wrap: wrap; row-gap: 4px; user-select: none; }
.stb.multi .lb { flex: 1 0 auto; }

<script>
const API = 'https://script.google.com/macros/s/AKfycbzV7KanxB2JDtmFqYjaUQP4G8-13B5Nl_r98fvbVuQrSAcgOHb4wsObIFAkJKDHP8tL/exec';
// 有寵物蛋的班：打勾＝寵物蛋「作業」加點（點數照寵物蛋試算表「設定」）
const PETS = {
  g3: 'https://script.google.com/macros/s/AKfycbxSHBtA4ROD4VT6JHD89K68ZCq-l8QAbAjMa8n4LCacEurO1hWzhrPn80TuTGGLz1fM/exec',
  g4: 'https://script.google.com/macros/s/AKfycbx5jschGhp3mGCpd1cYjyuwpennPMy4Jtal5D4UwTcHNUR73UTDRKWY2qvz-Onad7c9/exec',

const CLASSES = [['g3', '三年級'], ['g4', '四年級'], ['g5a', '五年級A'], ['g5b', '五年級B'], ['g6', '六年級']];
const CATS = [['jy', '講義'], ['fx', '單元複習'], ['ev', '期末評量'], ['kg', '考古卷']];
const ITEM = '完成';
const T_BLUE  = { '--main': '#3D9BE9', '--line': '#BFE0FA', '--text': '#2D4A66', '--bg': 'linear-gradient(160deg,#F2F9FF 0%,#E3F2FF 100%)' };
const T_LEMON = { '--main': '#F5A524', '--line': '#FFE29A', '--text': '#5A4520', '--bg': 'linear-gradient(160deg,#FFFDF0 0%,#FFF4CF 100%)' };

const T_PEACH = { '--main': '#F5874A', '--line': '#FFD3B5', '--text': '#5C3A24', '--bg': 'linear-gradient(160deg,#FFF8F1 0%,#FFE9D6 100%)' };
const THEMES = { g3: T_BLUE, g4: T_LEMON, g5a: T_MINT, g5b: T_MINT, g6: T_PEACH };
// 講義上學期單元（「講義」分頁直接列出來，不用先新增）
const g5 = ['01 複雜的統計圖', '02 因數和倍數', '03 多邊形', '04 擴分、約分和通分', '05 線對稱圖形', '06 異分母分數的加減',
  '07 整數四則運算', '08 平行四邊形、三角形、梯形面積', '09 時間的乘法與除法', '10 正方體與長方體'];

    <div class="row"><button class="btn main" onclick="S.modal=null;render()">好了</button></div>
  </div></div>`;
  }
  if (m.dueFor) return `<div class="mask" onclick="if(event.target===this){S.modal=null;render()}"><div class="sheet">
    <h3>${esc((S.view.cur || {}).name || '')} 期限</h3>${duePicker(m)}
    <div class="row"><span class="grow"></span><button class="btn" onclick="S.modal=null;render()">取消</button><button class="btn main" onclick="saveDue()">儲存</button></div>
  </div></div>`;
  return `<div class="mask" onclick="if(event.target===this){S.modal=null;render()}"><div class="sheet">
    <h3>修改</h3><label>名稱</label><input id="uname" type="text" value="${esc(m.name)}" maxlength="30">
    <div class="row"><button class="btn danger" onclick="delSheet()">刪除</button><span class="grow"></span>
      <button class="btn" onclick="S.modal=S.modal.back?{manage:true}:null;render()">取消</button><button class="btn main" onclick="saveEdit()">儲存</button></div>
  </div></div>`;
}
// 📲 加到主畫面：Android/電腦 Chrome 直接跳安裝；iPad/iPhone 不能自動加，跳出三步驟說明
const standalone = () => window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
async function addHome() {
  if (installEvt) { installEvt.prompt(); installEvt = null; return; }
  S.modal = { home: true }; render();
}
const SHARE_ICON = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3D9BE9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';

function pick(c) { S.cls = c; S.peek = false; LS.set('cls', c); render(); }
function pickCat(c) { LS.set('cat_' + S.cls, c); render(); }
function pickSheet(i) { const u = S.view[i]; if (u) { LS.set('sel_' + S.cls + '_' + u.cat, u.id); render(); } }
function setPet(on) { LS.set('pet_' + S.cls, on); toast(on ? '🐾 打勾會順便幫寵物蛋加點' : '打勾不加寵物點數'); }
async function login(given) {
  const pw = String(given != null ? given : ($('#pw') || {}).value || '').replace(/\s+/g, '');
  const msg = t => { const m = $('#msg'); if (m) m.textContent = t; };
  if (!pw) return msg('請先輸入密碼');
  msg('確認中…');
  S.key = pw;
  try { await api({ mode: 'ping' }); LS.set('key', pw); loadAll(); flush(); }
  catch (e) { S.key = ''; msg(e.message === 'bad_key' ? '密碼不對，請再試一次' : '連不上後台（要有網路才能第一次登入），請檢查網路再試'); }
}
function loginPrompt() { const k = prompt('管理密碼'); if (k) login(k); }

window.addEventListener('online', () => { render(); flush(); if (!S.q.length) loadAll(true); });
window.addEventListener('offline', () => { S.wasOffline = true; render(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S.key) return;
  flush(); if (!S.q.length && Date.now() - (S.lastLoad || 0) > 30000) loadAll(true);
  checkNew();
});
if (S.key) { render(); flush(); if (!S.q.length) loadAll(true); } else render();
// 離線也打得開：service worker 把網頁存在平板（要先連網打開過一次）
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// 自動換新版：iPad Safari／主畫面會暫存舊網頁，開啟時偷偷抓最新的比對版本，不一樣就自動重新載入（VER 由 tasks.cjs deploy 蓋上）
const VER = '202611281659';
async function checkNew() {
  if (VER.startsWith('__') || !navigator.onLine) return;
  try {
    const t = await (await fetch('./?nocache=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const VER = '([^']+)'/);
    if (m && m[1] !== VER && !m[1].startsWith('__')) location.replace('./?v=' + m[1]);
  } catch (e) {}
}
checkNew();
</script>
