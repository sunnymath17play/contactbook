<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SUNNY 寵物蛋</title>
<link rel="icon" href="img/icon_egg.png">
<link rel="apple-touch-icon" href="img/icon_egg.png">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#3a2a18;--sub:#8a6d4b;--orange:#ff8a1f;--green:#2e9e4f;--blue:#1857c4;--pink:#e8267f;--line:#f0dcc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,#ffb347,#ff8a1f);color:#fff}
header img{width:40px;height:40px;border-radius:10px;background:#fff}
header h1{font-size:21px;margin:0;flex:1}
main{max-width:560px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(150,100,40,.12)}
h2{font-size:20px;margin:0 0 12px}
.muted{color:var(--sub);font-size:15px}
button{font:inherit;border:none;border-radius:16px;cursor:pointer}
.big{display:block;width:100%;padding:16px;font-size:20px;font-weight:bold;background:var(--orange);color:#fff}
.ghost{background:none;color:var(--sub);text-decoration:underline;font-size:15px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.namebtn{padding:16px 4px;font-size:21px;font-weight:bold;background:#fff3df;color:var(--ink);border:2px solid var(--line)}
.namebtn.on{border-color:var(--orange);background:#ffe1b8}
.pnin{font-size:24px;padding:10px 12px;border:3px solid var(--line);border-radius:14px;width:80%;max-width:320px;text-align:center;font-weight:bold}
.warn{color:#c0392b;margin-top:10px;font-size:17px}
.pnl{font-size:13px;color:#9a6a2a;font-weight:normal}.pnl .need{color:#c0392b}
.pendbox{background:#fff1f0;border:2px solid #ffc9c2;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:16px}
.prow{display:flex;gap:6px;margin-top:6px}.psel{flex:1;font-size:16px;padding:6px;border-radius:10px;border:1px solid var(--line)}
.plink,.pign{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}.plink{background:#2e9e4f;color:#fff}
.howto{text-align:left}.howto h2{text-align:center}.howto ol{padding-left:22px;margin:6px 0 10px;font-size:16.5px;line-height:1.55}.howto li{margin-bottom:6px}
.morebtn{padding:6px 10px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-left:4px;flex:none}
.newkid{margin-left:auto;background:#2e9e4f!important;color:#fff!important}
.b-cus{background:#8a6bd1!important;color:#fff!important}
.leftbox{margin:14px 0 90px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.lrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;color:#8a7a6a}
.restbtn{padding:5px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
.dlg h2{margin:0 0 8px}.dlg .pnin{width:90%;font-size:20px}
.menu{display:flex;flex-direction:column;gap:8px;margin:8px 0}.menu button{padding:12px;font-size:18px;border-radius:12px;border:1px solid var(--line);background:#fff8ec;text-align:left}
.menu .danger{color:#c0392b}
.regbtn{padding:6px 10px;font-size:14px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-left:4px;flex:none}
/* 寵物 */
.pet{position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto}
.pet .emo{line-height:1}
.pet img{width:100%;height:100%;object-fit:contain}
.pet .deco{position:absolute;font-size:.28em;top:-4%;right:2%}
.s2 .emo{filter:drop-shadow(0 0 6px #ffd84a)}
.s3{border-radius:50%;background:radial-gradient(circle,#fff6c9 30%,transparent 70%)}
.s3 .emo{filter:drop-shadow(0 0 10px #ffb400)}
.s4{border-radius:50%;background:radial-gradient(circle,#fff 20%,#ffe9f5 45%,#e0f2ff 60%,transparent 72%);animation:glow 2.4s ease-in-out infinite}
.s4 .emo{filter:drop-shadow(0 0 14px #ff6ad5)}
@keyframes glow{50%{transform:scale(1.04)}}
.egg{width:62%;height:78%;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;position:relative;overflow:hidden;box-shadow:inset -10px -12px 0 rgba(0,0,0,.08);animation:wob 3s ease-in-out infinite}
.egg i{position:absolute;border-radius:50%;background:rgba(255,255,255,.55)}
.egg .crack{position:absolute;left:0;right:0;top:44%;height:14%;opacity:0}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
.bar{height:22px;border-radius:11px;background:#f3e6d2;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;background:linear-gradient(90deg,#ffcf5a,#ff8a1f);border-radius:11px;transition:width .8s}
.lv{display:inline-block;background:var(--blue);color:#fff;border-radius:12px;padding:2px 12px;font-weight:bold;font-size:17px}
.center{text-align:center}
.rules li{margin:6px 0}
.recent div{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px dashed var(--line)}
.recent b{color:var(--green)}
.garden{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.garden>div{background:#fff3df;border-radius:16px;padding:8px 2px 10px;text-align:center;font-weight:bold}
.garden>div.me{background:#ffe1b8;outline:3px solid var(--orange)}
body.embed header{display:none}
body.cardm{background:transparent}body.cardm header,body.cardm nav{display:none!important}body.cardm main{padding:0;max-width:none}
.pcard{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid #ffd59a;border-radius:22px;padding:8px 14px 8px 8px;cursor:pointer;
  box-shadow:0 3px 12px rgba(245,124,58,.15);min-height:88px;font-size:16px;line-height:1.35}
.pcard .pc-t{flex:1;min-width:0}.pcard b{font-size:18px}.pcard .bar{height:10px;margin:5px 0 3px}
.pcard .go{font-size:22px;color:var(--orange);font-weight:bold}
.pcard .em{font-size:44px;width:72px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:12px 0 14px;font-size:17px;color:var(--sub);border-radius:0}
nav button.on{color:var(--orange);font-weight:bold}
nav button span{display:block;font-size:26px}
.mask{position:fixed;inset:0;background:rgba(40,25,10,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.dlg{background:#fff;border-radius:22px;padding:22px;max-width:360px;width:100%;text-align:center}
.dlg .row{display:flex;gap:10px;margin-top:16px}
.dlg .row button{flex:1;padding:14px;font-size:19px;font-weight:bold}
.yes{background:var(--orange);color:#fff}.no{background:#eee;color:#555}
.party{font-size:26px;font-weight:bold;color:var(--pink);margin:8px 0}
.confetti{position:fixed;top:-20px;font-size:26px;z-index:10;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pickgrid button{background:#fff3df;border:2px solid var(--line);padding:12px 4px;font-size:19px;font-weight:bold;color:var(--ink)}
.loading{text-align:center;color:var(--sub);padding:40px 0}
/* 管理頁 */
.adm .krow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#fff;margin-bottom:8px;border:2px solid transparent;box-shadow:0 1px 4px rgba(150,100,40,.1)}
.adm .krow.on{border-color:var(--orange);background:#fff1dc}
.adm .krow .nm{flex:1;font-size:20px;font-weight:bold}
.adm .krow .pt{color:var(--sub);font-size:15px;text-align:right}
.adm .ck{width:28px;height:28px;border-radius:8px;border:2px solid #d9c3a5;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.adm .on .ck{background:var(--orange);border-color:var(--orange)}
.actbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.actbar button{flex:1;padding:14px 2px;font-size:17px;font-weight:bold;color:#fff}
.actbar button:disabled{opacity:.35}
.b-hw{background:var(--green)}.b-fix{background:var(--blue)}.b-half{background:#7a8ea8}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.toolbar button{background:#fff3df;padding:8px 14px;font-size:16px;color:var(--ink)}
.lastbox{background:#eef5ff;border-radius:14px;padding:10px 12px;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lastbox span{flex:1}
.lastbox button{background:var(--pink);color:#fff;padding:8px 12px;font-size:15px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:14px;z-index:20;font-size:16px;max-width:90%}
/* ===== 會動的寵物（SUNNY：動物要會動）===== */
.mv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:50% 96%;animation-duration:2.4s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.mv img{position:absolute}
.mv-cat{animation-name:sway;animation-duration:2.6s}
.mv-dog{animation-name:bounce;animation-duration:.9s}
.mv-dragon{animation-name:waddle;animation-duration:1.3s}
.mv-bunny{animation-name:hop;animation-duration:2.2s}
.mv-penguin{animation-name:waddle2;animation-duration:1s}
.mv-bear{animation-name:sway;animation-duration:3.4s}
.mv-owl{animation-name:tilt;animation-duration:3s}
.mv-unicorn{animation-name:float;animation-duration:3s}
@keyframes sway{0%,100%{transform:rotate(-3deg) scaleY(1)}50%{transform:rotate(3deg) scaleY(1.025)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.02,.98)}45%{transform:translateY(-5%) scale(.98,1.03)}}
@keyframes waddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2%)}}
@keyframes waddle2{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes hop{0%,55%,100%{transform:translateY(0) scale(1,1)}62%{transform:translateY(0) scale(1.06,.92)}75%{transform:translateY(-12%) scale(.96,1.05)}88%{transform:translateY(0) scale(1.05,.95)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}60%{transform:rotate(5deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
.shell{animation:shellwob 1.6s ease-in-out infinite}
@keyframes shellwob{0%,100%{rotate:-3deg}50%{rotate:4deg}}
/* 點一下：跳起來＋愛心 */
.pet.tap .mv{animation:jump .7s ease-out 1 !important}
@keyframes jump{0%{transform:scale(1.08,.9)}35%{transform:translateY(-22%) scale(.95,1.08) rotate(-6deg)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.heart{position:absolute;left:50%;top:30%;font-size:26px;pointer-events:none;animation:heart 1s ease-out forwards;z-index:3}
@keyframes heart{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-90px) scale(1.2)}}
.egg{transform-origin:50% 92%}
.egg.eggimg{width:100%;height:100%;border-radius:0;overflow:visible;box-shadow:none;background:none}
.egg.eggimg img{width:100%;height:100%;object-fit:contain}
/* 蛋：快孵化時晃得更厲害 */
.egg.hot{animation:wobhot 1.4s ease-in-out infinite}
@keyframes wobhot{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-9deg)}72%{transform:rotate(9deg)}78%{transform:rotate(-7deg)}84%{transform:rotate(6deg)}90%{transform:rotate(-2deg)}}
.pet.tap .egg{animation:wobhot .6s ease-in-out 1}
@media (prefers-reduced-motion: reduce){.mv,.shell,.egg,.egg.hot{animation:none !important}}
/* 收藏簿、守護神獸 */
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.album>div{background:#fff3df;border-radius:14px;padding:6px 2px;text-align:center;font-size:13px;font-weight:bold;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.album .empty{background:#f6efe4;border:2px dashed #e5d3b8}
.album .slot{width:56px;height:56px;border-radius:50%;background:#efe3d0;color:#b39a78;display:flex;align-items:center;justify-content:center;font-size:22px}
.album .gift{grid-column:span 2;background:linear-gradient(135deg,#fff3c4,#ffe0f0)}
.guard{border-radius:50%;background:radial-gradient(circle,#fff 15%,#fff3c4 40%,#ffd6f0 58%,transparent 72%)}
.guard .scroll{position:absolute;transform:translate(-50%,-50%) rotate(-3deg);background:#fffdf3;border:2px solid #d9a84a;border-radius:6px;padding:.3em .6em;font-weight:900;color:#c0392b;text-align:center;line-height:1.2;box-shadow:0 2px 6px rgba(120,80,0,.25);z-index:2}
.garden>div{position:relative}
.garden>div.legend{background:linear-gradient(135deg,#fff3c4,#ffe0f0);outline:3px solid #ffb400}
.pet .prop{position:absolute;left:0;top:2%;width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(150,100,40,.25);line-height:1;z-index:2;animation:propbob 2.2s ease-in-out infinite}
@keyframes propbob{50%{transform:translateY(-12%) rotate(-6deg)}}
@media (prefers-reduced-motion: reduce){.pet .prop{animation:none}}
.route{display:inline-block;margin-top:8px;background:#fff1dc;color:#9a5a1c;border-radius:12px;padding:3px 12px;font-weight:bold;font-size:16px}
.ladder{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:8px;font-size:14px;color:var(--sub)}
.ladder span{background:#f6efe4;border-radius:10px;padding:2px 8px}
.ladder span.now{background:var(--orange);color:#fff;font-weight:bold}
.nbadge{position:absolute;top:4px;right:6px;font-size:12px;background:#fff;border-radius:10px;padding:1px 6px;color:#8a6d4b}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><h1 id="ttl">SUNNY 寵物蛋</h1></header>
<main id="app"><div class="loading">載入中…</div></main>
<nav id="nav" style="display:none">
  <button data-t="me" class="on"><span>🐣</span>我的寵物</button>
  <button data-t="garden"><span>🏡</span>寵物園</button>
</nav>
<script>
// ===== 設定 =====
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxSHBtA4ROD4VT6JHD89K68ZCq-l8QAbAjMa8n4LCacEurO1hWzhrPn80TuTGGLz1fM/exec";   // Apps Script 網頁應用程式網址（空白＝本機測試模式，資料只存這支手機）
// 阿居畫好、已放進 img/ 的圖（一張一張加；沒列的先用暫代）。蛋＝egg_0~9，寵物＝<代號>_1~4
const ART = new Set(["dragon_1", "dragon_2", "dragon_3", "dragon_4", "cat_1", "dog_1", "bunny_1", "penguin_1", "bear_1", "owl_1", "unicorn_1", ...Array.from({length:10}, (_, i) => "egg_" + i),
  // 人生路線圖（SUNNY 2026-10-23 驗收 OK）
  ...[["dragon",["math","actuary","chef","astro"]],["cat",["boxing","detective","piano","fashion"]],["dog",["rescue","vet","soccer","engineer"]],["bunny",["jump","farm","ballet","baker"]],["penguin",["swim","polar","weather","robot"]],["bear",["boss","lift","forest","doctor"]],["owl",["writer","star","teacher","chess"]],["unicorn",["paint","magic","sing","prism"]]].flatMap(([p,rs])=>rs.flatMap(r=>[2,3,4].map(s=>p+"_"+r+"_"+s)))]);

// 8 種寵物：挑蛋時後台偷偷抽，孵出來才揭曉
const PETS = {
  dragon:  {nm:"小火龍",   emo:"🐲"},
  cat:     {nm:"喵喵",     emo:"🐱"},
  dog:     {nm:"汪汪",     emo:"🐶"},
  bunny:   {nm:"跳跳兔",   emo:"🐰"},
  penguin: {nm:"企企",     emo:"🐧"},
  bear:    {nm:"小熊",     emo:"🐻"},
  owl:     {nm:"貓頭鷹",   emo:"🦉"},
  unicorn: {nm:"小獨角獸", emo:"🦄"}
};
// 10 顆蛋：每顆特徵都不同（顏色＋花紋＋造型），跟寵物無關
const EGGS = [
  {nm:"愛心蛋",   bg:"#ffb3cf", mark:"💗", dots:"💗"},
  {nm:"翅膀蛋",   bg:"#bfe6ff", mark:"🪽", wings:1},
  {nm:"星星蛋",   bg:"#ffe066", mark:"⭐", dots:"⭐"},
  {nm:"尖刺蛋",   bg:"#8fdc8f", mark:"", spikes:1},
  {nm:"閃電蛋",   bg:"#c9a7ff", mark:"⚡"},
  {nm:"火焰蛋",   bg:"#ff9a52", mark:"🔥", top:"🔥"},
  {nm:"彩虹蛋",   bg:"linear-gradient(#ff8a8a,#ffd166,#9be29b,#8ecbff,#c9a7ff)", mark:""},
  {nm:"冰晶蛋",   bg:"#e9f6ff", mark:"❄️", dots:"❄️"},
  {nm:"花朵蛋",   bg:"#fff1c9", mark:"🌸", top:"🌼"},
  {nm:"月亮蛋",   bg:"#2f3f8f", mark:"🌙", dots:"✦", dc:"#fff6a8", top:"🌙"}
];
// ===== 人生路線（SUNNY 2026-10-23：每隻長大會有不同專長，不要只有一種）=====
// 每種寵物 4～5 條路線；[代號, 小道具, 寶寶, 少年, 勇者, 傳說]
// 圖：寶寶共用 <寵物>_1.png（頭上冒小道具）；少年／勇者／傳說＝img/<寵物>_<路線代號>_<2|3|4>.png，放好後加進 ART
// king＝最早畫的披風／國王圖（<寵物>_2~4.png），SUNNY 決定留著當小火龍、喵喵的第 5 條
const ROUTES = {
  dragon: [["math","🔢","愛數數字","數學小天才","數學競賽冠軍","數學博士"],
           ["actuary","🐷","愛玩存錢筒","算帳小高手","理財達人","精算師"],
           ["chef","🔥","愛烤棉花糖","小廚師","料理大賽冠軍","米其林主廚"],
           ["astro","🚀","愛飛高高","飛行小隊","飛行員","太空人"],
           ["king","👑","愛當小隊長","小隊長","火龍勇者","火龍王"]],
  cat:    [["boxing","🥊","愛追球跑跳","拳擊練習生","拳擊冠軍","奧運拳擊金牌"],
           ["detective","🔍","愛到處找東西","推理小偵探","名偵探","鑑識科學家"],
           ["piano","🎹","愛踩鋼琴鍵","鋼琴小樂手","音樂會獨奏","鋼琴家"],
           ["fashion","🧶","愛玩毛線球","編織小達人","服裝設計師","時尚設計大師"],
           ["king","👑","愛當小隊長","小隊長","喵喵勇者","喵喵王"]],
  dog:    [["rescue","🚒","愛幫忙找東西","搜救小隊員","消防英雄","搜救隊長"],
           ["vet","🩹","愛照顧受傷小鳥","小護理員","獸醫","動物醫院院長"],
           ["soccer","⚽","愛追球","足球隊前鋒","冠軍隊長","世界盃球星"],
           ["engineer","🏗️","愛挖沙堆蓋城堡","積木建築師","工程師","橋樑工程師"]],
  bunny:  [["jump","🏅","愛跳跳跳","跳高選手","全國冠軍","奧運跳高金牌"],
           ["farm","🥕","愛種紅蘿蔔","小農夫","植物學家","農業科學家"],
           ["ballet","🩰","愛轉圈圈","舞蹈社","芭蕾首席","舞蹈家"],
           ["baker","🧁","愛吃點心","烘焙小幫手","甜點師","甜點大師"]],
  penguin:[["swim","🏊","愛玩水","游泳校隊","游泳冠軍","奧運游泳金牌"],
           ["polar","🧊","愛玩冰塊","小探險家","極地科學家","南極探險隊長"],

// 同一個孩子收滿 8 種後再抽到同種寵物（第 9、10 隻），自動換下一條路線
// 後端若之後回傳 route（班上少見優先），就以後端為準
function hashStr(s){ let h=2166136261; for(const c of s){ h^=c.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function routeOf(pet, name, slot, given){
  const R = ROUTES[pet]; if(!R) return null;
  if(given!=null && given!=="" && R[+given]) return R[+given];
  return R[(hashStr(name+"|"+pet) + Math.floor((slot||0)/8)) % R.length];
}
const routeArt = (pet, r, stage) => r[0]==="king" ? `${pet}_${stage}` : `${pet}_${r[0]}_${stage}`;
const routeTitle = (r, stage) => r ? r[1+stage] : "";

const STAGE_NM = ["蛋","寶寶","少年","勇者","傳說","守護神獸"];
const DECO = ["","","✨","🌟","👑",""];

const DEF_CFG = {per:2,cls:1,e100:20,e95:10,hatch:10,teen:20,hero:32,legend:42,full:50,lvl:5,count:4,mHatch:20,gift:"立可帶"};

// ★ 進度計算：跟 Apps Script 的 stateOf_ 一模一樣（改一邊要一起改）
function stateOf(total, eggs, pets, C, routes){
  total = Math.max(0, total); routes = routes || [];
  const done = Math.min(Math.floor(total / C.full), C.count);
  const collection = [];
  for (let i = 0; i < done; i++) collection.push({ egg: eggs[i] === undefined ? '' : eggs[i], pet: pets[i] || '', route: routes[i] === undefined ? '' : routes[i] });
  if (done >= C.count) {
    const pts = total - C.count * C.full, hatched = pts >= C.mHatch;
    return { done, collection, mystery: true, pts, hatched, stage: hatched ? 5 : 0, level: 0, needPick: false,
      next: hatched ? null : { at: C.mHatch, what: 'mhatch' } };
  }
  const pts = total - done * C.full;
  const needPick = eggs.length <= done;
  const stage = pts < C.hatch ? 0 : pts < C.teen ? 1 : pts < C.hero ? 2 : pts < C.legend ? 3 : 4;
  const level = stage ? Math.floor((pts - C.hatch) / C.lvl) + 1 : 0;
  const steps = [[C.hatch, 'hatch'], [C.teen, 'teen'], [C.hero, 'hero'], [C.legend, 'legend'], [C.full, 'full']];
  const nx = steps.find(s => pts < s[0]);
  return { done, collection, mystery: false, pts, stage, level, needPick,
    egg: needPick ? '' : eggs[done], pet: needPick ? '' : pets[done], route: needPick || routes[done] === undefined ? '' : routes[done],
    next: nx ? { at: nx[0], what: nx[1] } : null };
}
function publicState(st, C, withGift){
  const o = { done: st.done, collection: st.collection, mystery: st.mystery, pts: st.pts, stage: st.stage, level: st.level,
    needPick: st.needPick, next: st.next, egg: st.egg, pet: st.stage ? st.pet : '', route: st.stage ? st.route : '' };
  if (st.mystery && st.hatched && withGift) o.gift = C.gift;
  return o;
}

  const minPick = (pool,cnt) => { const mn=Math.min(...pool.map(x=>cnt[x]||0)); const c=pool.filter(x=>(cnt[x]||0)===mn); return c[Math.floor(Math.random()*c.length)]; };
  const addEgg = (d,k,egg) => { const ALL=Object.keys(PETS); let pool=ALL.filter(x=>!k.pets.includes(x)); if(!pool.length) pool=ALL.slice();
    const n={}; d.kids.forEach(x=>x.pets.forEach(q=>n[q]=(n[q]||0)+1)); const pet=minPick(pool,n);
    const rc={}; d.kids.forEach(x=>x.pets.forEach((q,i)=>{ if(q===pet&&x.routes[i]!=null) rc[x.routes[i]]=(rc[x.routes[i]]||0)+1; }));
    k.eggs.push(+egg); k.pets.push(pet); k.routes.push(minPick([...Array(RN[pet]).keys()],rc)); };
  const R = {"作業":c=>c.per,"課堂":c=>c.cls,"考試100":c=>c.e100,"考試95":c=>c.e95};

        const hit=d.kids.filter(k=>!k.left&&([k.full,k.name,k.full.slice(1)].map(nk).includes(qq)||(k.alias||[]).includes(qq)));
        if(hit.length!==1){ d.pend=d.pend||[]; if(qq&&!d.pend.includes(q.name)) d.pend.push(q.name); save(d); return {ok:true,status:"unknown"}; }
        const k=hit[0]; return k.pn?{ok:true,status:"linked",pn:k.pn}:{ok:true,status:"new",name:k.name,hasEgg:k.eggs.length>0}; }
      if(q.mode==="garden") return {ok:true, cfg:c, kids:d.kids.filter(k=>k.pn&&!k.left).map(k=>{const s=publicState(st(k,p,c),c,false);
        return {pn:k.pn,egg:s.egg,pet:s.pet,route:s.route,stage:s.stage,mystery:s.mystery,n:s.done,needPick:s.needPick};}).sort((a,b)=>a.pn<b.pn?-1:1)};
      if(q.mode==="me"){ const k=findPet(d,q.pet); if(!k) return {ok:false,err:"no_pet"};
        const mine=d.log.filter(l=>l.full===k.full), tot=p[k.full]||0;
        return {ok:true,pn:k.pn,points:tot,cfg:c,recent:mine.slice(-6).reverse().map(l=>({d:md(l.at),why:l.why,pts:l.pts})),
          ...publicState(stateOf(tot,k.eggs,k.pets,c,k.routes),c,true)}; }

      if(b.mode==="admin"){ const lb=d.log.length?d.log.filter(l=>l.batch===d.log[d.log.length-1].batch):[];
        return {ok:true,per:c.per,cfg:c,pending:(d.pend||[]).map(x=>({typed:x,d:""})),left:d.kids.filter(k=>k.left).map(k=>({full:k.full,name:k.name,pn:k.pn,points:p[k.full]||0})),kids:d.kids.filter(k=>!k.left).map(k=>{const s=st(k,p,c);

      if(b.mode==="leave"||b.mode==="restore"){ const on=b.mode==="leave"; const k=d.kids.find(x=>!!x.left===!on&&(x.full===b.name||x.name===b.name)); if(!k) return {ok:false,err:"no_kid"}; k.left=on; save(d); return {ok:true}; }

  const scroll = gift==null ? "" : `<div class="scroll" style="left:${S.x*100}%;top:${S.y*100}%;max-width:${S.w*size}px;font-size:${Math.max(10,size*.07)}px">${gift?esc(gift):"🎁"}</div>`;
  return `<div class="pet s4 guard" style="${box}"><div class="mv mv-unicorn" style="${dl()}">${body}${scroll}</div></div>`;
}
const creature = (k, size) => k.mystery ? (k.stage ? guardianHTML(size, k.gift) : mysteryEggHTML(size, k.hot))

document.addEventListener("click", e => {
  const el = e.target.closest("#app .pet, .dlg .pet"); if(!el || el.closest(".pickgrid") || el.closest(".krow")) return;
  el.classList.remove("tap"); void el.offsetWidth; el.classList.add("tap"); setTimeout(()=>el.classList.remove("tap"), 750);
  for(let i=0;i<3;i++){ const h=document.createElement("span"); h.className="heart"; h.textContent=["💗","✨","💛"][i];
    h.style.setProperty("--dx", (i-1)*34+"px"); h.style.animationDelay=i*.08+"s"; el.appendChild(h); setTimeout(()=>h.remove(),1200); }
  boop();
});
function boop(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain(); o.type="sine";
  o.frequency.setValueAtTime(520,a.currentTime); o.frequency.exponentialRampToValueAtTime(880,a.currentTime+.12); o.connect(g); g.connect(a.destination);
  g.gain.setValueAtTime(.2,a.currentTime); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.25); o.start(); o.stop(a.currentTime+.3); }catch(e){} }

function dialog(html, yes, no){

    if(no) m.querySelector(".no").onclick=()=>{m.remove();res(false)};

}
function formDlg(html, yes){
  return new Promise(res=>{
    const m=document.createElement("div"); m.className="mask";
    m.innerHTML=`<div class="dlg">${html}<div class="row"><button class="no">取消</button><button class="yes">${yes||"確定"}</button></div></div>`;
    document.body.appendChild(m);
    const f=m.querySelector("input"); if(f) setTimeout(()=>f.focus(),50);
    const val=()=>{ const o={}; m.querySelectorAll("[data-k]").forEach(i=>o[i.dataset.k]=i.value.trim()); return o; };
    m.querySelector(".yes").onclick=()=>{ const v=val(); m.remove(); res(v); };
    m.querySelector(".no").onclick=()=>{ m.remove(); res(null); };
  });
}
function toast(t, ms){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), ms||2200); }
function chime(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [523,659,784,1047].forEach((f,i)=>{
    const o=a.createOscillator(), g=a.createGain(); o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(a.destination);
    const t=a.currentTime+i*.13; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.35); o.start(t); o.stop(t+.4); }); }catch(e){}
}
function confetti(){ const E=["🎉","⭐","✨","🎊","💛"]; for(let i=0;i<28;i++){ const s=document.createElement("div"); s.className="confetti"; s.textContent=E[i%E.length];
  s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.8+Math.random()*1.6)+"s"; s.style.animationDelay=Math.random()*.6+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),4200);} }

async function showCard(){
  const box=(inner)=>{ $("#app").innerHTML=`<div class="pcard" id="pc">${inner}<span class="go">›</span></div>`; $("#pc").onclick=()=>toParent("open"); };
  box(`<div class="em">🥚</div><div class="pc-t"><b>我的寵物蛋</b><div class="muted">載入中…</div></div>`);
  try{
    if(!ME){
      const nm=whName();
      if(!nm) return box(`<div class="em">🥚</div><div class="pc-t"><b>三年級寵物蛋</b><div class="muted">先在下面打上你的名字，<br>就能領一顆蛋喔！</div></div>`);
      const r=await apiGet({mode:"byName",name:nm});
      if(r.status==="linked"){ ME=r.pn; LS.set("pn",ME); }
      else if(r.status==="new") return box(`<div class="em">🥚</div><div class="pc-t"><b>${esc(r.name)}，你的蛋在等你！</b><div class="muted">點我${r.hasEgg?"幫寵物取名字":"挑一顆蛋"} 👉</div></div>`);
      else return box(`<div class="em">🥚</div><div class="pc-t"><b>寵物蛋</b><div class="muted">SUNNY 還在確認「${esc(nm)}」是誰，<br>確認好就能領蛋囉！</div></div>`);
    }
    const d=await apiGet({mode:"me",pet:ME});
    if(!d.ok){ LS.del("pn"); ME=null; return showCard(); }
    const C={...DEF_CFG,...(d.cfg||{})}, P=PETS[d.pet]||{}, E=EGGS[d.egg]||{nm:"蛋"};
    const R=!d.mystery&&d.stage?routeOf(d.pet,"",d.done,d.route):null;
    if(d.needPick) return box(`<div class="em">🥚</div><div class="pc-t"><b>${esc(d.pn)} 收進收藏簿了！</b><div class="muted">點我挑下一顆蛋 👉</div></div>`);
    let pct=100, line="";
    if(d.next){ const prev=d.mystery?0:[0,C.hatch,C.teen,C.hero,C.legend][d.stage]; pct=Math.max(0,Math.min(100,(d.pts-prev)/(d.next.at-prev)*100)); line=`再 ${d.next.at-d.pts} 點${NEXT_TXT[d.next.what]}`; }
    const nm = d.mystery ? (d.stage?"守護神獸":"神秘蛋") : d.stage ? (routeTitle(R,d.stage)||P.nm) : E.nm;
    box(`<div style="width:76px;flex:none">${creature({stage:d.stage,pet:d.pet,egg:d.egg,mystery:d.mystery,gift:null,n:d.done,route:d.route,hot:!!(d.next&&d.next.at-d.pts<=4&&!d.stage)},76)}</div>

  }catch(e){ box(`<div class="em">🥚</div><div class="pc-t"><b>我的寵物蛋</b><div class="muted">點我進去看</div></div>`); }
}

  let msg="";
  if(d.mystery && stage && !(seen.mystery && seen.stage)) msg=`🎉 守護神獸出現了！<br>牠帶來了禮物：<br><span style="color:#3a2a18">${esc(d.gift||"")}</span>`;
  else if(d.mystery && !seen.mystery) msg=`🌟 收藏簿集滿了！<br>出現一顆神秘蛋！`;
  else if(!d.mystery && seen.done===d.done){
    if(stage>seen.stage) msg = seen.stage===0 ? `🐣 孵出來了！<br>是${P.nm}！<br><span style="font-size:20px;color:#9a5a1c">${R?R[1]+" 牠"+esc(R[2]):""}</span>`
      : `🌈 變身了！<br>變成「${esc(routeTitle(R,stage)||STAGE_NM[stage])}」！${stage===4?`<br><span style="font-size:18px;color:#9a5a1c">${P.nm}的夢想實現了 ✨</span>`:""}`;
    else if(level>seen.level) msg=`⬆️ 升到 Lv ${level} 了！`;
  }
  if(msg) setTimeout(()=>{ chime(); confetti(); dialog(`${creature(who,150)}<div class="party">${msg}</div><div class="muted">繼續加油，SUNNY 看到了！</div>`,"耶！"); }, 300);
}
async function showGarden(){
  setTab("garden");
  $("#app").innerHTML='<div class="loading">載入中…</div>';
  let g; try{ g=await apiGet({mode:"garden"}); }catch(e){ return fail(); }
  $("#app").innerHTML=`<div class="card center" style="padding:12px"><h2 style="margin:0">🏡 三年級寵物園</h2></div>
    <div class="garden">${g.kids.map(k=>`<div class="${k.pn===ME?"me":""}${k.mystery&&k.stage?" legend":""}">${creature({...k,name:"",gift:k.mystery&&k.stage?"":null},84)}<div>${esc(k.pn)}</div>${k.n?`<div class="nbadge">📖 ${k.n}</div>`:""}</div>`).join("")}</div>`;
}
function setTab(t){ document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); }
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=> b.dataset.t==="me"?showMe():showGarden());

// ===== 管理頁（?admin）=====
let KEY = LS.get("key"), SEL = new Set(), ADM = null;
async function admin(){
  $("#ttl").textContent="寵物蛋・加點";
  if(!KEY){
    const k=prompt("管理密碼"); if(!k) return; KEY=k;
  }
  let d; try{ d=await apiPost({mode:"admin",key:KEY}); }catch(e){ return fail(); }
  if(!d.ok){ LS.del("key"); KEY=null; alert("密碼不對"); return admin(); }
  LS.set("key",KEY); ADM=d; renderAdmin();
}
function renderAdmin(){
  const d=ADM, per=d.per;
  $("#app").className="adm";
  $("#app").innerHTML=`
    ${d.last?`<div class="lastbox"><span>上一筆：${esc(d.last.d)} ${esc(d.last.why)} ${d.last.pts>0?"+":""}${d.last.pts}　${d.last.names.map(esc).join("、")}</span><button id="undo">復原</button></div>`:""}
    ${(d.pending||[]).map(p=>`<div class="pendbox"><div>🌳 樹洞有人打了「<b>${esc(p.typed)}</b>」${esc(p.d)}，是誰？</div>
      <div class="prow"><select class="psel" data-t="${esc(p.typed)}"><option value="">選孩子…</option>${d.kids.map(k=>`<option value="${esc(k.full)}">${esc(k.full)}</option>`).join("")}</select>
      <button class="plink" data-t="${esc(p.typed)}">連結</button><button class="pign" data-t="${esc(p.typed)}">忽略</button></div></div>`).join("")}
    <div class="toolbar"><button id="all">全選</button><button id="none">清除</button><span class="muted" id="cnt"></span><button id="newkid" class="newkid">＋新生</button></div>
    ${d.kids.map(k=>`<div class="krow${SEL.has(k.name)?" on":""}" data-n="${esc(k.name)}"><div class="ck">✓</div>
      <div style="width:44px">${creature({stage:k.stage,pet:k.pet,egg:k.egg,mystery:k.mystery,gift:null,name:"",n:k.n,route:k.route},44)}</div>
      <div class="nm">${esc(k.name)}<div class="pnl">${k.pn?"🐾 "+esc(k.pn):"<span class=need>還沒登記</span>"}</div></div>
      <button class="regbtn" data-n="${esc(k.name)}">${k.pn?"✏️":"登記"}</button><button class="morebtn" data-n="${esc(k.name)}">⋯</button>
      <div class="pt">${k.points} 點<br>${k.mystery?(k.stage?"守護神獸":"神秘蛋"):(k.needPick?"待挑蛋":k.stage?"Lv "+k.level+" "+esc(routeTitle(routeOf(k.pet,"",k.n,k.route),k.stage)||STAGE_NM[k.stage]):"蛋")}${k.n?"・📖"+k.n:""}</div></div>`).join("")}
    <div class="actbar"><button class="b-hw" data-r="作業">作業 +${per}</button><button class="b-fix" data-r="課堂">課堂 +${d.cfg.cls}</button><button class="b-half" data-r="考試100">考 100 +${d.cfg.e100}</button><button class="b-half" data-r="考試95">考 95↑ +${d.cfg.e95}</button><button class="b-cus" data-r="自訂">自訂 ±</button></div>
    ${(d.left||[]).length?`<div class="leftbox"><div class="muted">已退班（點數和寵物都留著）</div>${d.left.map(k=>`<div class="lrow"><span>${esc(k.full)}${k.pn?"　🐾"+esc(k.pn):""}　${k.points} 點</span><button class="restbtn" data-n="${esc(k.full)}">恢復</button></div>`).join("")}</div>`:""}`;
  const cnt=()=>{ $("#cnt").textContent=SEL.size?`已選 ${SEL.size} 人`:"點名字選人"; document.querySelectorAll(".actbar button").forEach(b=>b.disabled=!SEL.size); };
  document.querySelectorAll(".krow").forEach(r=>r.onclick=e=>{ if(e.target.closest(".regbtn,.morebtn")) return; const n=r.dataset.n; SEL.has(n)?SEL.delete(n):SEL.add(n); r.classList.toggle("on"); cnt(); });
  document.querySelectorAll(".regbtn").forEach(b=>b.onclick=()=>register(d.kids.find(k=>k.name===b.dataset.n)));
  document.querySelectorAll(".morebtn").forEach(b=>b.onclick=()=>kidMenu(d.kids.find(k=>k.name===b.dataset.n)));
  document.querySelectorAll(".plink").forEach(b=>b.onclick=async()=>{
    const full=[...document.querySelectorAll(".psel")].find(s=>s.dataset.t===b.dataset.t).value;
    if(!full) return toast("先選是哪個孩子");
    const r=await apiPost({mode:"link",key:KEY,typed:b.dataset.t,full}); toast(r.ok?`✅「${b.dataset.t}」＝${full}，下次樹洞就認得了`:"沒成功", 3500); admin(); });
  document.querySelectorAll(".pign").forEach(b=>b.onclick=async()=>{
    const r=await apiPost({mode:"link",key:KEY,typed:b.dataset.t,full:""}); toast(r.ok?"已忽略":"沒成功"); admin(); });
  document.querySelectorAll(".restbtn").forEach(b=>b.onclick=async()=>{
    if(!await dialog(`<div style="font-size:20px">讓 <b>${esc(b.dataset.n)}</b> 回來？<br><span class="muted">點數和寵物都會恢復</span></div>`,"恢復","取消")) return;
    const r=await apiPost({mode:"restore",key:KEY,name:b.dataset.n}); toast(r.ok?"✅ 已恢復 "+b.dataset.n:"沒成功"); admin(); });
  $("#newkid").onclick=async()=>{
    const v=await formDlg(`<h2>➕ 新生</h2><div class="muted">全名（例：王小明）</div><input class="pnin" data-k="full" maxlength="10">
      <div class="muted" style="margin-top:8px">平常叫他（可空白，預設去掉姓）</div><input class="pnin" data-k="name" maxlength="10">`,"加入");
    if(!v||!v.full) return;
    const r=await apiPost({mode:"addKid",key:KEY,full:v.full,name:v.name});
    if(!r.ok) return toast(r.err==="exists"?"已經有這個人了":r.err==="dup_short"?`已經有人叫「${r.name}」，請填不一樣的叫法`:"沒成功："+(r.err||""), 3500);
    toast(r.restored?"✅ 以前退班的，已恢復":"✅ 已加入 "+v.full+"，記得按「登記」挑蛋", 3500); admin(); };
  $("#all").onclick=()=>{ d.kids.forEach(k=>SEL.add(k.name)); renderAdmin(); };
  $("#none").onclick=()=>{ SEL.clear(); renderAdmin(); };
  if($("#undo")) $("#undo").onclick=async()=>{
    if(!confirm("復原上一筆？")) return;
    const r=await apiPost({mode:"undo",key:KEY}); toast(r.ok?`已復原：${r.removed.map(n=>n.slice(1)).join("、")}`:"沒有可以復原的"); admin();
  };
  document.querySelectorAll(".actbar button").forEach(b=>b.onclick=async()=>{
    const names=[...SEL];
    if(b.dataset.r==="自訂") return customPts(names);
    if(/考試/.test(b.dataset.r) && !confirm(`${b.textContent}：${names.join("、")}，確定？`)) return;
    b.disabled=true;
    let r; try{ r=await apiPost({mode:"add",key:KEY,names,reason:b.dataset.r}); }catch(e){ toast("網路有問題，沒加到"); b.disabled=false; return; }
    if(!r.ok){ toast("沒加到："+(r.err||"")); b.disabled=false; return; }
    toast(`✅ ${b.dataset.r} +${r.pts}：${names.join("、")}`, 3000); SEL.clear(); admin();
  });
  cnt();
}

// 自訂加點／扣點（扣點打負數）
async function customPts(names){
  if(!names.length) return;
  const v=await formDlg(`<h2>自訂點數</h2><div class="muted">${names.map(esc).join("、")}</div>
    <div class="muted" style="margin-top:8px">點數（扣點打負數，例：-2）</div><input class="pnin" data-k="pts" type="number" inputmode="numeric" step="1">
    <div class="muted" style="margin-top:8px">原因（孩子看得到）</div><input class="pnin" data-k="why" maxlength="12" placeholder="例：幫忙收作業">`,"送出");
  if(!v) return;
  const p=Math.round(+v.pts);
  if(!p||Math.abs(p)>100) return toast("點數要是 -100～100、不能是 0");
  const why=v.why||(p>0?"加分":"扣點");
  let r; try{ r=await apiPost({mode:"add",key:KEY,names,reason:why,pts:p}); }catch(e){ return toast("網路有問題，沒加到"); }
  if(!r.ok) return toast("沒成功："+(r.err||""));
  toast(`✅ ${why} ${p>0?"+":""}${p}：${names.join("、")}`, 3000); SEL.clear(); admin();
}
// 單一孩子的選單
async function kidMenu(k){
  if(!k) return;
  const m=document.createElement("div"); m.className="mask";
  m.innerHTML=`<div class="dlg"><h2>${esc(k.full)}${k.pn?`<div class="muted">🐾 ${esc(k.pn)}・${k.points} 點</div>`:""}</h2>
    <div class="menu"><button data-a="reg">${k.pn?"✏️ 改寵物名字":"🥚 登記（挑蛋＋取名）"}</button>
    <button data-a="pts">± 幫他加點／扣點</button>
    ${k.pn&&!k.needPick?`<button data-a="reset">🔄 現在這顆蛋重挑</button>`:""}
    <button data-a="leave" class="danger">👋 退班</button></div>
    <div class="row"><button class="no">關閉</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector(".no").onclick=()=>m.remove();
  m.querySelectorAll(".menu button").forEach(b=>b.onclick=async()=>{ m.remove(); const a=b.dataset.a;
    if(a==="reg") return register(k);
    if(a==="pts") return customPts([k.name]);
    if(a==="reset"){ if(!await dialog(`<div style="font-size:19px">讓 <b>${esc(k.full)}</b> 重挑現在這顆蛋？<br><span class="muted">寵物會重抽、收藏簿不動、點數不變</span></div>`,"重挑","取消")) return;
      const r=await apiPost({mode:"resetPet",key:KEY,name:k.full}); toast(r.ok?"✅ 已重設，按「登記」讓他重挑":"沒成功"); return admin(); }
    if(a==="leave"){ if(!await dialog(`<div style="font-size:19px"><b>${esc(k.full)}</b> 退班？<br><span class="muted">從名單和寵物園拿掉；點數、寵物都留著，之後可以恢復</span></div>`,"退班","取消")) return;
      const r=await apiPost({mode:"leave",key:KEY,name:k.full}); toast(r.ok?"已退班："+k.full:"沒成功"); SEL.delete(k.name); return admin(); }
  });
}
// 登記：還沒挑蛋→先挑蛋，再取寵物名字；已登記→只改名字
async function register(k){
  if(!k) return;
  let egg = "";
  if(k.needPick && !k.n){
    egg = await new Promise(res=>{
      $("#app").className="";
      $("#app").innerHTML=`<div class="card center"><h2>🥚 ${esc(k.name)}，挑一顆蛋！</h2>
        <div class="muted">裡面住著誰？<b>孵出來才知道！</b><br>挑了就不能換喔</div></div>
        <div class="pickgrid">${EGGS.map((e,i)=>`<button data-e="${i}">${eggHTML(i,96)}${e.nm}</button>`).join("")}</div>
        <div class="center"><button class="ghost" id="regback">← 回加點頁</button></div>`;
      $("#regback").onclick=()=>res(null);
      document.querySelectorAll(".pickgrid button").forEach(b=>b.onclick=async()=>{
        const i=+b.dataset.e;
        if(await dialog(`${eggHTML(i,130)}<div style="font-size:21px">要 <b>${EGGS[i].nm}</b> 嗎？</div>`,"就是它！","再想想")) res(i);
      });
    });
    if(egg===null) return renderAdmin();
  }
  const ask = async (msg) => {
    $("#app").className="";
    $("#app").innerHTML=`<div class="card center"><h2>🐾 ${esc(k.name)} 的寵物叫什麼名字？</h2>
      <div class="muted">之後在家打這個名字就能看寵物（最多 12 個字，不能跟別人一樣）</div>
      ${egg!==""?`<div style="margin:8px 0">${eggHTML(egg,90)}</div>`:""}
      <input id="pnin" class="pnin" maxlength="12" autocomplete="off" value="${esc(k.pn||"")}" placeholder="寵物名字">
      ${msg?`<div class="warn">${msg}</div>`:""}
      <div style="margin-top:12px"><button class="ghost" id="regno">取消</button> <button class="big" id="regok">確定</button></div></div>`;
    $("#pnin").focus();
    $("#regno").onclick=()=>{ egg!=="" ? ask("蛋還沒存，請取好名字按確定") : renderAdmin(); };
    $("#regok").onclick=async()=>{
      const v=$("#pnin").value.replace(/\s+/g,""); if(!v) return ask("要先取名字喔");
      $("#regok").disabled=true;
      let r; try{ r=await apiPost({mode:"register",key:KEY,name:k.full||k.name,petName:v,egg}); }catch(e){ return ask("網路有問題，再按一次確定"); }
      if(!r.ok) return ask(r.err==="dup"?`「${esc(v)}」已經有人用了，換一個`:"沒成功："+esc(r.err||""));
      toast(`✅ ${k.name} 的寵物：${r.pn}`, 3000); admin();
    };
  };
  ask("");
}

// ===== 開始 =====
if(/[?&]admin/.test(location.search)) admin();
else if(CARD) showCard();
else showMe();
</script>
